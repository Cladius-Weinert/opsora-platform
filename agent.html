<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opsora Agent — Universal AI Chat</title>
<meta name="description" content="Opsora AI Agent — chat with any AI model through a single interface.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,300;0,500;1,300&family=Rubik:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f1ea;--bg2:#ebe7dd;--bg3:#e0dcd1;--surface:#fff;--border:#d8d2c5;--text:#1a1612;--text2:#5b5548;--text3:#8b8578;--accent:#c43e2c;--accent2:#2a6f6b;--font-serif:'Instrument Serif',Georgia,serif;--font-mono:'JetBrains Mono',monospace;--font-sans:'Rubik',system-ui,sans-serif;--radius:12px}
html,body{height:100%}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);display:flex;font-weight:300;overflow:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");pointer-events:none}
.sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;height:100vh}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-family:var(--font-serif);font-size:1.3rem;font-style:italic;font-weight:400}
.sidebar-nav{padding:16px 12px;flex:1}
.sidebar-nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;color:var(--text2);font-size:.88rem;text-decoration:none;transition:all .2s}
.sidebar-nav a:hover{background:var(--bg2);color:var(--text)}
.sidebar-nav a.active{background:var(--bg2);color:var(--accent);border-left:2px solid var(--accent)}
.main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0}
.main-header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface)}
.main-header h2{font-family:var(--font-serif);font-size:1.1rem;font-weight:400}
.chat-area{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.msg{display:flex;gap:14px;max-width:80%;animation:fadeUp .4s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg .avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:500;flex-shrink:0;font-family:var(--font-serif);font-style:italic}
.msg.assistant .avatar{background:var(--accent);color:#fff}
.msg.user .avatar{background:var(--accent2);color:#fff}
.msg .bubble{padding:14px 20px;border-radius:var(--radius);font-size:.9rem;line-height:1.7;font-weight:300}
.msg.assistant .bubble{background:var(--bg2);border:1px solid var(--border)}
.msg.user .bubble{background:rgba(42,111,107,.08);border:1px solid rgba(42,111,107,.15)}
.msg .bubble .meta{font-size:.7rem;color:var(--text3);font-family:var(--font-mono);margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;gap:16px}
.input-area{padding:16px 24px;border-top:1px solid var(--border);background:var(--bg2)}
.input-row{display:flex;gap:8px}
.input-row input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px 18px;color:var(--text);font-family:var(--font-sans);font-size:.9rem;outline:none;font-weight:300}
.input-row input:focus{border-color:var(--accent)}
.input-row button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:14px 24px;font-weight:500;cursor:pointer;font-family:var(--font-sans);font-size:.85rem}
.input-row button:hover{background:#a83222}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.welcome h2{font-family:var(--font-serif);font-size:2rem;font-weight:400;margin-bottom:8px}
.welcome p{color:var(--text2);max-width:400px;margin-bottom:32px}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.suggestion{padding:8px 16px;border-radius:100px;font-size:.8rem;background:var(--surface);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .2s}
.suggestion:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:768px){.sidebar{display:none}.msg{max-width:95%}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-header"><h1>Opsora</h1></div>
  <div class="sidebar-nav">
    <a href="#" class="active">💬 New Chat</a>
    <a href="dashboard.html">📊 Analytics</a>
    <a href="index.html">← Home</a>
  </div>
</aside>
<div class="main">
  <div class="main-header"><h2>New Chat</h2><span style="font-size:.75rem;color:var(--text3);font-family:var(--font-mono)">opsora-fast · DeepSeek V4 Flash</span></div>
  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <h2>Welcome to <span style="color:var(--accent)">Opsora</span></h2>
      <p>Ask anything — I'll route to the best AI model for the job.</p>
      <div class="suggestions">
        <span class="suggestion" onclick="suggest('Explain quantum computing')">Explain quantum computing</span>
        <span class="suggestion" onclick="suggest('Write Python code to sort a list of dicts')">Write Python code</span>
        <span class="suggestion" onclick="suggest('Best API design practices')">API design tips</span>
      </div>
    </div>
  </div>
  <div class="input-area">
    <div class="input-row">
      <input type="text" id="chatInput" placeholder="Message Opsora..." autocomplete="off">
      <button id="chatSend">Send</button>
    </div>
  </div>
</div>
<script>
const area=document.getElementById('chatArea'),welcome=document.getElementById('welcome'),inp=document.getElementById('chatInput'),btn=document.getElementById('chatSend')
function addMsg(r,t,m){const d=document.createElement('div');d.className='msg '+r;let e=m?'<div class="meta"><span>⚡ '+m+' tokens</span></div>':'';d.innerHTML='<div class="avatar">'+(r==='assistant'?'O':'U')+'</div><div class="bubble">'+t+e+'</div>';area.appendChild(d);d.scrollIntoView({behavior:'smooth'})}
btn.addEventListener('click',async()=>{const t=inp.value.trim();if(!t)return;inp.value='';if(welcome)welcome.style.display='none';addMsg('user',t);btn.disabled=true;addMsg('assistant','Gateway: opsora-gateway.opsora-ai.workers.dev\nRegister for a free API key to start chatting!');btn.disabled=false})
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();btn.click()}})
function suggest(t){inp.value=t;btn.click()}
</script>
</body>
</html>
